
<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>میانالی | اپلیکیشن‌های SprintTime و DynamicCrop</title>
  <meta name="description" content="Discover SprintTime for sprint timing and DynamicCrop for dynamic video cropping. Apps by Mehdi Azizi.">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Tahoma, sans-serif;
      background: linear-gradient(135deg, #e3edf0, #bdd9f6);
      color: #1e3c18;
      direction: rtl;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 35px 25px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(30, 56, 24, 0.2);
      overflow-wrap: anywhere;
    }

    .miyanali {
      margin-bottom: 22px;
      color: #1e8518;
      font-size: clamp(32px, 8vw, 45px);
      font-weight: 900;
      line-height: 1.2;
      direction: ltr;
      text-shadow: 1px 1px 3px rgba(30, 56, 24, 0.2);
    }

    .message {
      margin: 14px 0;
      line-height: 1.8;
    }

    .instagram {
      display: inline-block;
      margin: 8px 0;
      padding: 9px 16px;
      border-radius: 12px;
      background: #e0e5ff;
      box-shadow: 0 4px 8px rgba(29, 24, 133, 0.15);
      color: #1d1885;
      font-size: 22px;
      font-weight: 600;
      direction: ltr;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: 0.2s ease;
    }

    .instagram:hover {
      background: #1d1885;
      color: #fff;
      transform: translateY(-2px);
    }

    .apps-title {
      margin: 30px 0 18px;
      padding-top: 22px;
      border-top: 1px solid #e5e7eb;
      font-size: 21px;
      line-height: 1.6;
      color: #25334a;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      direction: ltr;
    }

    .app-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 16px 10px;
      border: 1px solid #e5e7eb;
      border-radius: 15px;
      background: #fff;
      color: #1f2937;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.5;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .app-link:hover {
      transform: translateY(-4px);
      box-shadow: 0 7px 18px rgba(15, 23, 42, 0.12);
    }

    .app-link img {
      display: block;
      width: 100px;
      height: 100px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 18px;
    }

    .app-link span {
      overflow-wrap: anywhere;
    }

    .app-hint {
      margin-top: 16px;
      color: #5b6575;
      font-size: 14px;
      line-height: 1.8;
    }

    @media (max-width: 350px) {
      .container {
        padding: 25px 16px;
      }

      .apps {
        gap: 10px;
      }

      .app-link {
        padding: 12px 6px;
        font-size: 14px;
      }

      .app-link img {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="miyanali">Miyanali.com</div>

    <div class="message">
      سایت میانالی فعلا از دسترس خارج شده است
    </div>

    <div class="message">
      برای اطلاع از برنامه‌های آینده پیج اینستاگرام سایت را فالو کنید.
    </div>

    <a
      class="instagram"
      href="https://www.instagram.com/miyanali_com/"
      target="_blank"
      rel="noopener noreferrer"
    >@miyanali_com</a>

    <h1 class="apps-title">Explore Android Apps</h1>

    <section class="apps" aria-label="Android apps">
      <a
        class="app-link"
        href="https://drmehdiazizi.github.io/sprinttime/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Explore SprintTime"
      >
        <img
          src="https://raw.githubusercontent.com/drmehdiazizi/sprinttime/main/icon.png"
          alt="SprintTime app icon"
          width="100"
          height="100"
        >
        <span>SprintTime</span>
      </a>

      <a
        class="app-link"
        href="https://drmehdiazizi.github.io/DynamicCrop/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Explore DynamicCrop"
      >
        <img
          src="https://raw.githubusercontent.com/drmehdiazizi/DynamicCrop/main/icon.png"
          alt="DynamicCrop app icon"
          width="100"
          height="100"
        >
        <span>DynamicCrop</span>
      </a>
    </section>

    <div class="app-hint">
      Tap an app icon to learn more about it.
    </div>
  </main>
</body>
</html>
